<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        video { width: 100%; max-height: 100vh; }
    </style>
</head>
<body>

<video id="player" controls crossorigin></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('player');
        const originalUrl = 'https://in-mc-flive.fancode.com/mumbai/4248968_english_hls_8302d8a0e337876_1ta-di_h264/720p.m3u8?hdntl=Expires=1789732660~_GO=Generated~acl=/mumbai/4248968_english_hls_8302d8a0e337876_1ta-di_h264/*~Signature=AVl424OopuygFpyOLD5yHVUsL9vF_5SAW_83Ow8n0KJCGux2wNyjHu-6OnPGpMITuMc5XD4qgepGqybRN6hC5JjhRCkC';
        const source = `/?url=${encodeURIComponent(originalUrl)}`;

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(source);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                new Plyr(video);
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = source;
            new Plyr(video);
        }
    });
</script>

</body>
</html>
